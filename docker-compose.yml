services:
  web:
    build: .
    ports:
      - "3080:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # 개발용 (로컬에서 개발할 때)
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3080:3000"
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

volumes:
  node_modules:
